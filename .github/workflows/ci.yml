name: "Align CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-latest:
    name: Unit Tests (iOS 26.2, Xcode 26.2)
    runs-on: macOS-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 17 Pro"
          xcrun simctl bootstatus "iPhone 17 Pro" -b
      - name: Run Tests
        run: xcodebuild test -scheme "Align" -destination "OS=26.2,name=iPhone 17 Pro" | xcbeautify
  macos-latest:
    name: Unit Tests (macOS, Xcode 26.2)
    runs-on: macOS-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: xcodebuild test -scheme "Align" -destination "platform=macOS" | xcbeautify
  tvos-latest:
    name: Unit Tests (tvOS 26.2, Xcode 26.2)
    runs-on: macOS-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Boot simulator
        run: |
          xcrun simctl boot "Apple TV"
          xcrun simctl bootstatus "Apple TV" -b
      - name: Run Tests
        run: xcodebuild test -scheme "Align" -destination "OS=26.2,name=Apple TV" | xcbeautify
  macos-xcode-26-0:
    name: Unit Tests (macOS, Xcode 26.0)
    runs-on: macOS-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: xcodebuild test -scheme "Align" -destination "platform=macOS" | xcbeautify
  swift-build:
    name: Swift Build (SPM)
    runs-on: macOS-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
